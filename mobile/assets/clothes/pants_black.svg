<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 280" width="100%" height="100%">
  <defs>
    <!-- Midnight Charcoal Wool Blend Gradient -->
    <linearGradient id="trouserGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242F42" />
      <stop offset="40%" stop-color="#151D2A" />
      <stop offset="85%" stop-color="#0A0E17" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="pantsDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.45)" />
    </filter>
  </defs>

  <g filter="url(#pantsDrop)">
    <!-- TWO TAILORED TROUSER LEGS REACHING ANKLES -->
    <path d="M 24,6 L 96,6 C 104,20 112,40 112,65 C 106,110 102,165 96,276 L 72,276 C 72,220 70,165 66,110 L 60,78 L 54,110 C 50,165 48,220 48,276 L 24,276 C 18,165 14,110 8,65 C 8,40 16,20 24,6 Z" fill="url(#trouserGrad)" stroke="#334155" stroke-width="0.8" />

    <!-- Tailored Waistband with Concealed Hook Bar -->
    <path d="M 24,6 L 96,6 L 97,18 L 23,18 Z" fill="#0F172A" stroke="#334155" stroke-width="0.6" />

    <!-- Extended Waistband Tab Closure -->
    <rect x="54" y="6" width="12" height="12" fill="#1E293B" stroke="#475569" stroke-width="0.5" />

    <!-- Minimalist Belt Loops -->
    <rect x="32" y="5" width="2" height="14" fill="#334155" />
    <rect x="48" y="5" width="2" height="14" fill="#334155" />
    <rect x="72" y="5" width="2" height="14" fill="#334155" />
    <rect x="88" y="5" width="2" height="14" fill="#334155" />

    <!-- Sharp Pressed Front Creases (Ly quần thẳng tắp kéo dài đôi chân) -->
    <line x1="36" y1="18" x2="36" y2="272" stroke="rgba(255,255,255,0.18)" stroke-width="0.9" />
    <line x1="84" y1="18" x2="84" y2="272" stroke="rgba(255,255,255,0.18)" stroke-width="0.9" />

    <!-- Diagonal Slanted Pockets -->
    <line x1="24" y1="18" x2="36" y2="44" stroke="#475569" stroke-width="0.9" />
    <line x1="96" y1="18" x2="84" y2="44" stroke="#475569" stroke-width="0.9" />

    <!-- Center Fly Placket -->
    <line x1="60" y1="18" x2="60" y2="60" stroke="#1E293B" stroke-width="0.8" />

    <!-- Tailored Turn-Up Hem Cuffs -->
    <rect x="24" y="270" width="24" height="6" fill="#0B111E" stroke="#334155" stroke-width="0.5" />
    <rect x="72" y="270" width="24" height="6" fill="#0B111E" stroke="#334155" stroke-width="0.5" />
  </g>
</svg>
