<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 50" width="100%" height="100%">
  <defs>
    <linearGradient id="snkUpper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="snkSole" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <filter id="snkDrop" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.35)" />
    </filter>
  </defs>

  <g filter="url(#snkDrop)">
    <!-- LEFT SNEAKER -->
    <g>
      <!-- Sole -->
      <path d="M 8,36 Q 28,38 48,37 Q 54,35 55,30 L 55,42 C 48,47 24,47 8,45 C 4,44 3,38 8,36 Z" fill="url(#snkSole)" stroke="#CBD5E1" stroke-width="0.7" />
      <line x1="10" y1="41" x2="52" y2="41" stroke="#94A3B8" stroke-width="0.6" stroke-dasharray="3,2" />

      <!-- Upper -->
      <path d="M 10,36 C 8,24 16,14 26,16 C 33,18 38,12 47,12 C 53,12 55,22 55,30 C 51,35 40,37 10,36 Z" fill="url(#snkUpper)" stroke="#94A3B8" stroke-width="0.7" />
      <!-- Toe Cap -->
      <path d="M 44,20 Q 50,20 54,30 C 50,34 44,35 41,32 Q 43,24 44,20 Z" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.6" />
      <!-- Gold Stripe -->
      <path d="M 20,28 Q 33,26 46,22 L 47,25 Q 33,30 19,31 Z" fill="#D4AF37" opacity="0.95" />
      <!-- Laces -->
      <line x1="28" y1="18" x2="32" y2="21" stroke="#CBD5E1" stroke-width="1.2" stroke-linecap="round" />
      <line x1="32" y1="19" x2="36" y2="22" stroke="#CBD5E1" stroke-width="1.2" stroke-linecap="round" />
      <line x1="36" y1="20" x2="40" y2="23" stroke="#CBD5E1" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- RIGHT SNEAKER -->
    <g>
      <!-- Sole -->
      <path d="M 112,36 Q 92,38 72,37 Q 66,35 65,30 L 65,42 C 72,47 96,47 112,45 C 116,44 117,38 112,36 Z" fill="url(#snkSole)" stroke="#CBD5E1" stroke-width="0.7" />
      <line x1="110" y1="41" x2="68" y2="41" stroke="#94A3B8" stroke-width="0.6" stroke-dasharray="3,2" />

      <!-- Upper -->
      <path d="M 110,36 C 112,24 104,14 94,16 C 87,18 82,12 73,12 C 67,12 65,22 65,30 C 69,35 80,37 110,36 Z" fill="url(#snkUpper)" stroke="#94A3B8" stroke-width="0.7" />
      <!-- Toe Cap -->
      <path d="M 76,20 Q 70,20 66,30 C 70,34 76,35 79,32 Q 77,24 76,20 Z" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.6" />
      <!-- Gold Stripe -->
      <path d="M 100,28 Q 87,26 74,22 L 73,25 Q 87,30 101,31 Z" fill="#D4AF37" opacity="0.95" />
      <!-- Laces -->
      <line x1="92" y1="18" x2="88" y2="21" stroke="#CBD5E1" stroke-width="1.2" stroke-linecap="round" />
      <line x1="88" y1="19" x2="84" y2="22" stroke="#CBD5E1" stroke-width="1.2" stroke-linecap="round" />
      <line x1="84" y1="20" x2="80" y2="23" stroke="#CBD5E1" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </g>
</svg>
