<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 50" width="100%" height="100%">
  <defs>
    <linearGradient id="loaferGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283548" />
      <stop offset="40%" stop-color="#151D2A" />
      <stop offset="85%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="goldBit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <filter id="loaferDrop" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.45)" />
    </filter>
  </defs>

  <g filter="url(#loaferDrop)">
    <!-- LEFT LOAFER -->
    <g>
      <!-- Heel & Sole -->
      <path d="M 8,38 L 20,38 L 20,44 C 15,44 9,43 8,41 Z" fill="#0A0E17" stroke="#334155" stroke-width="0.6" />
      <path d="M 20,37 Q 38,39 55,34 L 55,39 C 38,44 20,42 20,37 Z" fill="#0A0E17" stroke="#334155" stroke-width="0.6" />

      <!-- Upper -->
      <path d="M 9,36 C 8,24 16,16 26,17 C 34,18 41,13 49,13 C 55,13 56,24 55,32 C 45,36 21,37 9,36 Z" fill="url(#loaferGrad)" stroke="#334155" stroke-width="0.7" />

      <!-- Apron Stitching -->
      <path d="M 32,17 Q 44,17 50,22 Q 52,27 47,30 Q 38,32 30,30" fill="none" stroke="#64748B" stroke-width="0.6" stroke-dasharray="1.5,1.2" />

      <!-- Gold Horsebit -->
      <rect x="27" y="19" width="6" height="14" rx="1.5" fill="#1E293B" stroke="#475569" stroke-width="0.5" />
      <rect x="25" y="24" width="10" height="2.5" rx="1" fill="url(#goldBit)" />
      <circle cx="25" cy="25" r="2.2" fill="none" stroke="url(#goldBit)" stroke-width="0.8" />
      <circle cx="35" cy="25" r="2.2" fill="none" stroke="url(#goldBit)" stroke-width="0.8" />
    </g>

    <!-- RIGHT LOAFER -->
    <g>
      <!-- Heel & Sole -->
      <path d="M 112,38 L 100,38 L 100,44 C 105,44 111,43 112,41 Z" fill="#0A0E17" stroke="#334155" stroke-width="0.6" />
      <path d="M 100,37 Q 82,39 65,34 L 65,39 C 82,44 100,42 100,37 Z" fill="#0A0E17" stroke="#334155" stroke-width="0.6" />

      <!-- Upper -->
      <path d="M 111,36 C 112,24 104,16 94,17 C 86,18 79,13 71,13 C 65,13 64,24 65,32 C 75,36 99,37 111,36 Z" fill="url(#loaferGrad)" stroke="#334155" stroke-width="0.7" />

      <!-- Apron Stitching -->
      <path d="M 88,17 Q 76,17 70,22 Q 68,27 73,30 Q 82,32 90,30" fill="none" stroke="#64748B" stroke-width="0.6" stroke-dasharray="1.5,1.2" />

      <!-- Gold Horsebit -->
      <rect x="87" y="19" width="6" height="14" rx="1.5" fill="#1E293B" stroke="#475569" stroke-width="0.5" />
      <rect x="85" y="24" width="10" height="2.5" rx="1" fill="url(#goldBit)" />
      <circle cx="85" cy="25" r="2.2" fill="none" stroke="url(#goldBit)" stroke-width="0.8" />
      <circle cx="95" cy="25" r="2.2" fill="none" stroke="url(#goldBit)" stroke-width="0.8" />
    </g>
  </g>
</svg>
