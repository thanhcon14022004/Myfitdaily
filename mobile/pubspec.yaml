name: myfitdaily_mobile
description: "MYFITDAILY - Your Personal AI Stylist Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking & REST API
  dio: ^5.7.0

  # State Management
  provider: ^6.1.2

  # Secure storage for JWT
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # UI, Icons, Typography
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  intl: ^0.19.0

  # Camera & Gallery
  image_picker: ^1.1.2

  # 3D Model Engine
  model_viewer_plus: ^1.10.0

  # Cupertino Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/clothes/
    - assets/models/

