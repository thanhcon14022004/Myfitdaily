<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MYFITDAILY - AI Fashion Stylist & 3D Virtual Try-On">

  <!-- iOS / PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MyFitDaily">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MYFITDAILY - AI Stylist 3D</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Google Model Viewer Web Component — MUST be loaded here so that
    <model-viewer> custom element is registered before model_viewer_plus
    injects the HTML fragment via platformViewRegistry.
    The bundled version from model_viewer_plus package assets is used so
    it works offline / without internet access.
  -->
  <script type="module"
    src="./assets/packages/model_viewer_plus/assets/model-viewer.min.js"
    defer>
  </script>

</head>
<body>
  <!--
    model-viewer needs these global styles so the element fills the
    allocated space inside the Flutter PlatformView iframe.
  -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
    }
  </style>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
