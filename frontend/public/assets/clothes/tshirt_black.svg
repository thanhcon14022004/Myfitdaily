<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 160" width="100%" height="100%">
  <defs>
    <!-- Premium combed cotton black/charcoal gradient -->
    <linearGradient id="tshirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283244" />
      <stop offset="35%" stop-color="#192231" />
      <stop offset="75%" stop-color="#0F1622" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    <filter id="tshirtDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.4)" />
    </filter>
  </defs>

  <g filter="url(#tshirtDrop)">
    <!-- 1. LEFT SHORT SLEEVE (Hangs naturally along upper arm, fits inside outerwear) -->
    <path d="M 16,26 C 12,42 11,62 12,78 L 34,75 C 34,60 35,46 35,46 Z" fill="url(#tshirtGrad)" stroke="#1F2937" stroke-width="0.7" />
    <line x1="12" y1="78" x2="34" y2="75" stroke="#374151" stroke-width="0.8" />

    <!-- 2. RIGHT SHORT SLEEVE (Hangs naturally along upper arm, fits inside outerwear) -->
    <path d="M 124,26 C 128,42 129,62 128,78 L 106,75 C 106,60 105,46 105,46 Z" fill="url(#tshirtGrad)" stroke="#1F2937" stroke-width="0.7" />
    <line x1="128" y1="78" x2="106" y2="75" stroke="#374151" stroke-width="0.8" />

    <!-- 3. MAIN TORSO BODY -->
    <path d="M 52,8 C 38,15 24,22 16,26 L 35,46 C 36,65 37,85 38,105 C 38,122 36,140 36,155 L 104,155 C 104,140 102,122 102,105 C 103,85 104,65 105,46 L 124,26 C 116,22 102,15 88,8 Q 70,16 52,8 Z" fill="url(#tshirtGrad)" stroke="#1F2937" stroke-width="0.8" />

    <!-- 4. SUBTLE COTTON DRAPES & FABRIC HIGHLIGHTS -->
    <path d="M 48,55 Q 52,105 48,150" stroke="rgba(255,255,255,0.06)" stroke-width="1.2" fill="none" />
    <path d="M 92,55 Q 88,105 92,150" stroke="rgba(255,255,255,0.06)" stroke-width="1.2" fill="none" />
    <path d="M 58,95 Q 70,105 82,95" stroke="rgba(255,255,255,0.05)" stroke-width="1" fill="none" />

    <!-- 5. RIBBED CREW NECK COLLAR (Bo cổ tròn tinh tế, ôm khít đáy cổ) -->
    <path d="M 52,8 Q 70,22 88,8 Q 70,14 52,8 Z" fill="#0B0F17" stroke="#374151" stroke-width="0.8" />
    <!-- Collar inner depth -->
    <path d="M 54,8 Q 70,18 86,8 Q 70,14 54,8 Z" fill="#04060A" opacity="0.6" />

    <!-- Bottom Hem Double Stitching -->
    <line x1="36" y1="151" x2="104" y2="151" stroke="#374151" stroke-width="0.6" stroke-dasharray="2,1" />
  </g>
</svg>
