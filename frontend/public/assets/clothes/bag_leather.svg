<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Rich Saddle Leather Gradients -->
    <linearGradient id="leatherBagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A3412" />
      <stop offset="40%" stop-color="#7C2D12" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
    <linearGradient id="bagFlapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C2410C" />
      <stop offset="70%" stop-color="#9A3412" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>
    <linearGradient id="bagStrapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C2D12" />
      <stop offset="50%" stop-color="#9A3412" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>
    <linearGradient id="goldBagHardware" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>
    <filter id="bagShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="rgba(0,0,0,0.4)" />
    </filter>
  </defs>

  <g filter="url(#bagShadow)">
    <!-- Leather Shoulder Strap Arc -->
    <path d="M 70,165 C 50,40 270,40 250,165" fill="none" stroke="url(#bagStrapGrad)" stroke-width="8" stroke-linecap="round" />
    <!-- Strap Stitching Line -->
    <path d="M 70,165 C 50,40 270,40 250,165" fill="none" stroke="#FDBA74" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />

    <!-- Gold Rings connecting strap to bag -->
    <circle cx="70" cy="165" r="8" fill="none" stroke="url(#goldBagHardware)" stroke-width="3" />
    <circle cx="250" cy="165" r="8" fill="none" stroke="url(#goldBagHardware)" stroke-width="3" />

    <!-- Bag Main Body (Curved Baguette Silhouette) -->
    <path d="M 60,160 C 55,240 70,270 160,270 C 250,270 265,240 260,160 C 240,165 80,165 60,160 Z" fill="url(#leatherBagGrad)" stroke="#431407" stroke-width="1.5" />

    <!-- Saddle Edge Stitching on Main Body -->
    <path d="M 68,170 C 65,232 78,260 160,260 C 242,260 255,232 252,170" fill="none" stroke="#FDBA74" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.6" />

    <!-- Front Flap -->
    <path d="M 60,160 C 58,210 75,225 160,225 C 245,225 262,210 260,160 Z" fill="url(#bagFlapGrad)" stroke="#431407" stroke-width="1.5" />
    <!-- Flap Stitching -->
    <path d="M 68,162 C 67,204 80,218 160,218 C 240,218 253,204 252,162" fill="none" stroke="#FDBA74" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.6" />

    <!-- Center Magnetic Lock / Gold Clasp Logo -->
    <rect x="145" y="210" width="30" height="24" rx="5" fill="url(#goldBagHardware)" stroke="#713F12" stroke-width="1.5" />
    <rect x="152" y="216" width="16" height="12" rx="2" fill="#431407" />
    <circle cx="160" cy="222" r="3" fill="url(#goldBagHardware)" />
  </g>
</svg>
