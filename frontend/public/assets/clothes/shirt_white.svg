<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 160" width="100%" height="100%">
  <defs>
    <!-- Crisp Egyptian poplin cotton gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#F8FAFC" />
      <stop offset="85%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="shSleeveL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="shSleeveR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="shirtDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.22)" />
    </filter>
  </defs>

  <g filter="url(#shirtDrop)">
    <!-- 1. LEFT SLEEVE (Hangs naturally along torso hugging arm) -->
    <path d="M 16,26 C 12,48 11,90 12,148 L 28,146 C 29,95 32,52 35,46 Z" fill="url(#shSleeveL)" stroke="#94A3B8" stroke-width="0.7" />
    <line x1="12" y1="142" x2="28" y2="140" stroke="#94A3B8" stroke-width="0.8" />
    <circle cx="20" cy="144" r="1.1" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.4" />

    <!-- 2. RIGHT SLEEVE (Hangs naturally along torso hugging arm) -->
    <path d="M 124,26 C 128,48 129,90 128,148 L 112,146 C 111,95 108,52 105,46 Z" fill="url(#shSleeveR)" stroke="#94A3B8" stroke-width="0.7" />
    <line x1="128" y1="142" x2="112" y2="140" stroke="#94A3B8" stroke-width="0.8" />
    <circle cx="120" cy="144" r="1.1" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.4" />

    <!-- 3. MAIN SHIRT TORSO BODY -->
    <path d="M 52,8 C 38,15 24,22 16,26 L 35,46 C 36,65 37,85 38,105 C 38,122 36,140 36,155 L 104,155 C 104,140 102,122 102,105 C 103,85 104,65 105,46 L 124,26 C 116,22 102,15 88,8 Q 70,14 52,8 Z" fill="url(#shirtGrad)" stroke="#94A3B8" stroke-width="0.8" />

    <!-- 4. SUBTLE FABRIC FOLDS -->
    <path d="M 48,55 Q 52,105 48,150" stroke="rgba(148,163,184,0.3)" stroke-width="0.9" fill="none" />
    <path d="M 92,55 Q 88,105 92,150" stroke="rgba(148,163,184,0.3)" stroke-width="0.9" fill="none" />

    <!-- 5. CENTER BUTTON PLACKET -->
    <rect x="66" y="16" width="8" height="138" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.5" />

    <!-- Pearl Buttons -->
    <circle cx="70" cy="36" r="2.0" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.6" />
    <circle cx="70" cy="62" r="2.0" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.6" />
    <circle cx="70" cy="88" r="2.0" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.6" />
    <circle cx="70" cy="114" r="2.0" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.6" />
    <circle cx="70" cy="140" r="2.0" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.6" />

    <!-- Left Chest Pocket -->
    <path d="M 44,58 L 58,58 L 58,78 L 51,82 L 44,78 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.7" opacity="0.9" />

    <!-- 6. CRISP SPREAD COLLAR -->
    <!-- Collar back band -->
    <path d="M 52,8 Q 70,14 88,8 L 92,18 Q 70,22 48,18 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="0.6" />
    <!-- Left collar leaf point -->
    <path d="M 54,8 L 46,28 L 68,22 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.8" />
    <!-- Right collar leaf point -->
    <path d="M 86,8 L 94,28 L 72,22 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.8" />
  </g>
</svg>
